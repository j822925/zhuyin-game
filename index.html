<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音探險島 - 第一關：聽音辨位</title>
    <style>
        body {
            font-family: '微軟正黑體', 'Arial', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff69b4;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #ffc0cb;
        }

        .container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 按鈕共用樣式 */
        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: translateY(4px); }

        /* 登入區與下拉選單 */
        select {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #4CAF50;
        }

        #start-btn, #retry-btn {
            background-color: #ff9800;
            color: white;
            font-size: 1.8em;
            padding: 15px 30px;
            box-shadow: 0 4px #e68a00;
            display: block;
            margin: 0 auto;
        }

        /* 遊戲區按鈕 */
        #play-btn {
            background-color: #4CAF50;
            color: white;
            font-size: 2em;
            padding: 20px 40px;
            margin-bottom: 20px;
            box-shadow: 0 4px #2e8b57;
        }

        #options-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .option-btn {
            background-color: #ffb6c1;
            color: #333;
            font-size: 3em;
            font-weight: bold;
            padding: 20px 30px;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            width: 120px;
            height: 120px;
            margin: 10px;
            box-shadow: 0 4px #d87093;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .option-btn:hover { background-color: #ffc0cb; }
        .option-btn:active { box-shadow: 0 0 #d87093; }

        #message {
            font-size: 1.5em;
            margin-top: 20px;
            font-weight: bold;
            height: 30px;
        }

        #progress-text {
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🎈 注音探險島 🎈</h1>

    <!-- 畫面 1：座號選擇與載入 -->
    <div id="login-screen" class="container">
        <h2>請選擇你的座號</h2>
        <select id="seat-select">
            <option value="">請選擇座號...</option>
            <!-- 這裡會自動產生 1~30 號 -->
        </select>
        <button id="start-btn">🚀 開始闖關</button>
        <p id="loading-msg" style="display:none; color: #4CAF50; font-weight:bold; margin-top:20px;">
            ⏳ 正在讀取老師派發的任務...
        </p>
    </div>

    <!-- 畫面 2：遊戲主畫面 -->
    <div id="game-screen" class="container" style="display:none;">
        <h2 id="progress-text">第 1 題</h2>
        <button id="play-btn">▶️ 聽聽看</button>
        
        <div id="options-container"></div>
        <div id="message"></div>
    </div>
    
    <!-- 畫面 3：結算畫面 -->
    <div id="result-screen" class="container" style="display:none;">
        <h2 style="color:green;">🎉 闖關完成！太厲害了！</h2>
        <h3 id="result-text"></h3>
        <p style="color:#666;">成績已經傳送給老師囉！</p>
        <button id="retry-btn">🔄 再挑戰一次</button>
    </div>

    <script>
        // ==========================================
        // 老師設定區
        // ==========================================
        
        // ★★★ 請將單引號裡面的文字，換成你剛剛複製的 Google API 網址 ★★★
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzthN7YNMjzy_kBbKSOXMb0MLeTsy3hjk_ILn0Av7iHKaBEWjxAKOjL06SMfDQan8ac/exec'; 
        
        // 老師可以自由修改每次練習的總題數 (目前設定 10 題)
        const TOTAL_QUESTIONS = 10; 

        // 建立「聲音地圖」- 標準音檔順序
        const audioMap = {
            'ㄅ': 'audio_F1', 'ㄆ': 'audio_F2', 'ㄇ': 'audio_F3', 'ㄈ': 'audio_F4',
            'ㄉ': 'audio_F5', 'ㄊ': 'audio_F6', 'ㄋ': 'audio_F7', 'ㄌ': 'audio_F8',
            'ㄍ': 'audio_F9', 'ㄎ': 'audio_F10','ㄏ': 'audio_F11',
            'ㄐ': 'audio_F12','ㄑ': 'audio_F13','ㄒ': 'audio_F14',
            'ㄓ': 'audio_F15','ㄔ': 'audio_F16','ㄕ': 'audio_F17','ㄖ': 'audio_F18',
            'ㄗ': 'audio_F19','ㄘ': 'audio_F20','ㄙ': 'audio_F21',
            'ㄚ': 'audio_F22','ㄛ': 'audio_F23','ㄜ': 'audio_F24','ㄝ': 'audio_F25',
            'ㄞ': 'audio_F26','ㄟ': 'audio_F27','ㄠ': 'audio_F28','ㄡ': 'audio_F29',
            'ㄢ': 'audio_F30','ㄣ': 'audio_F31','ㄤ': 'audio_F32','ㄥ': 'audio_F33',
            'ㄦ': 'audio_F34',
            'ㄧ': 'audio_F35','ㄨ': 'audio_F36','ㄩ': 'audio_F37'
        };

        // ==========================================
        // 遊戲狀態變數
        // ==========================================
        let todaySounds = [];
        let currentTarget = '';
        let currentAudio = null;
        
        let seatNumber = '';
        let attemptCount = 1;     // 第幾次挑戰
        let questionCount = 0;    // 目前答對幾題
        let mistakesThisRound = 0;// 這回合總共錯幾次
        let hasMistakeOnCurrent = false; // 目前這題是否已經錯過了

        // 取得 HTML 元素
        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const seatSelect = document.getElementById('seat-select');
        const loadingMsg = document.getElementById('loading-msg');
        
        const playBtn = document.getElementById('play-btn');
        const optionsContainer = document.getElementById('options-container');
        const messageDiv = document.getElementById('message');
        const progressText = document.getElementById('progress-text');
        const resultText = document.getElementById('result-text');

// 自動產生包含姓名的下拉選單
        // 請在下方引號內填入你們班 14 位小朋友的名字，順序對應 1~14 號
        const studentNames = [
            "顏子羨", "呂宸寯", "闕宥承", "鍾鈞宇", "李宇濬",
            "吳承赫", "曾奎喆", "陳允澤", "趙芸", "鄭耘媃",
            "洪詩韻", "蔡宸琋", "盧宥芸", "陳妍霏"
        ];

        // 設定總共要產生幾個座號 (預留到 20 號)
        const TOTAL_SEATS = 20; 

        for(let i = 1; i <= TOTAL_SEATS; i++) {
            let option = document.createElement('option');
            let numStr = i < 10 ? '0' + i : i.toString();
            
            // 判斷這個號碼有沒有對應的姓名 (因為程式的計數是從 0 開始，所以要 i-1)
            if (i <= studentNames.length) {
                let name = studentNames[i - 1];
                option.textContent = numStr + ' 號 ' + name;
                // 這樣設定，傳送到 Google 試算表的成績就會直接顯示「01 號 王小明」
                option.value = numStr + ' ' + name; 
            } else {
                // 沒有名字的預留空號
                option.textContent = numStr + ' 號';
                option.value = numStr; 
            }
            
            seatSelect.appendChild(option);
        }

        // ==========================================
        // 流程 1：開始按鈕與讀取任務
        // ==========================================
        document.getElementById('start-btn').addEventListener('click', async () => {
            seatNumber = seatSelect.value;
            if (!seatNumber) {
                alert("小朋友，請先選擇你的座號喔！");
                return;
            }

            loadingMsg.style.display = 'block';
            
            try {
                // 從 Google 試算表讀取今日注音
                const response = await fetch(scriptUrl);
                const data = await response.json();
                
                if(data.length < 3) {
                    alert("老師的題庫好像不夠喔！請確保試算表裡至少有 3 個注音。");
                    loadingMsg.style.display = 'none';
                    return;
                }
                
                todaySounds = data;
                startRound(); // 成功抓取後，開始遊戲

            } catch (error) {
                console.error("讀取失敗", error);
                alert("讀取任務失敗了！請確認老師的 Google 網址是否正確。");
                loadingMsg.style.display = 'none';
            }
        });

        // ==========================================
        // 流程 2：開始新的一回合
        // ==========================================
        function startRound() {
            loginScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            
            questionCount = 0;
            mistakesThisRound = 0;
            nextQuestion();
        }

        // ==========================================
        // 流程 3：出題邏輯
        // ==========================================
        function nextQuestion() {
            questionCount++;
            hasMistakeOnCurrent = false; // 新題目重置錯誤狀態
            progressText.textContent = `第 ${questionCount} / ${TOTAL_QUESTIONS} 題`;
            messageDiv.textContent = '';

            // 從今日題庫隨機挑選答案
            currentTarget = todaySounds[Math.floor(Math.random() * todaySounds.length)];
            
            // 設定音檔 (注意副檔名是 .WAV 喔！)
            const audioFileName = audioMap[currentTarget];
            currentAudio = new Audio('audio/' + audioFileName + '.WAV');

            // 產生 3 個選項
            const options = generateOptions(currentTarget, todaySounds, 3);
            
            // 畫出按鈕
            optionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.addEventListener('click', () => checkAnswer(option));
                optionsContainer.appendChild(btn);
            });
            
            // 自動播放一次聲音
            setTimeout(() => { currentAudio.play(); }, 300);
        }

        function generateOptions(correct, pool, num) {
            let options = [correct];
            let wrongPool = pool.filter(item => item !== correct);
            
            // 如果今日注音太少，從全部注音補齊錯誤選項
            if (wrongPool.length < num - 1) {
                const allZhuyin = Object.keys(audioMap);
                const extra = allZhuyin.filter(item => !pool.includes(item) && item !== correct);
                wrongPool = wrongPool.concat(extra);
            }
            
            wrongPool = wrongPool.sort(() => 0.5 - Math.random());
            for (let i = 0; i < num - 1; i++) {
                options.push(wrongPool[i]);
            }
            return options.sort(() => 0.5 - Math.random());
        }

        // ==========================================
        // 流程 4：檢查答案 (錯了必須重選直到對)
        // ==========================================
        function checkAnswer(selectedOption) {
            if (selectedOption === currentTarget) {
                messageDiv.textContent = '🎉 答對了！太棒了！';
                messageDiv.style.color = 'green';
                
                // 答對了，檢查是否破關
                setTimeout(() => {
                    if (questionCount >= TOTAL_QUESTIONS) {
                        endRound();
                    } else {
                        nextQuestion();
                    }
                }, 1200);

            } else {
                // 答錯了
                messageDiv.textContent = '❌ 哎呀，再聽一次看看！';
                messageDiv.style.color = 'red';
                currentAudio.play(); // 播聲音提示
                
                // 確保同一題點錯好幾次，只會扣一次分
                if (!hasMistakeOnCurrent) {
                    mistakesThisRound++;
                    hasMistakeOnCurrent = true;
                }
            }
        }

        playBtn.addEventListener('click', () => {
            if (currentAudio) {
                currentAudio.play();
                messageDiv.textContent = '🔊 聽清楚囉...';
                messageDiv.style.color = '#333';
            }
        });

        // ==========================================
        // 流程 5：結算並傳送成績
        // ==========================================
        function endRound() {
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            
            resultText.textContent = `${seatNumber} 號小朋友，你錯了 ${mistakesThisRound} 次。`;
            
            // 將成績打包，透過我們做好的 API 傳給 Google 試算表
            const resultData = {
                seat: seatNumber,
                attempt: attemptCount,
                total: TOTAL_QUESTIONS,
                mistakes: mistakesThisRound
            };

            fetch(scriptUrl, {
                method: 'POST',
                // 使用 no-cors 模式確保資料送出不會被瀏覽器擋下
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(resultData)
            }).then(() => {
                console.log("成績已發送");
            }).catch(err => {
                console.error("成績發送發生錯誤", err);
            });
        }

        // 再挑戰一次按鈕
        document.getElementById('retry-btn').addEventListener('click', () => {
            attemptCount++; // 挑戰次數 +1
            startRound();   // 直接重新開始遊戲
        });

    </script>
</body>
</html>
